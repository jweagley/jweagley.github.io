# Keeps course-schedule/calendar-data.json in step with the Purdue Academic
# Calendar. Browsers can't read purdue.edu directly (bot protection blocks
# cross-origin requests), so this fetches it server-side once a day and
# commits the file only when the calendar actually changed.
name: Sync Purdue calendar

on:
  schedule:
    - cron: "17 11 * * *" # daily, ~6-7am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node course-schedule/sync-calendar.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- course-schedule/calendar-data.json course-schedule/adddrop-data.json; then
            echo "Calendar unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add course-schedule/calendar-data.json course-schedule/adddrop-data.json
            git commit -m "Update Purdue calendar data"
            git push
          fi
