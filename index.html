<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Test Page</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 3rem;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 480px;
  }
  h1 {
    margin-top: 0;
  }
  .badge {
    display: inline-block;
    background: #eef3ff;
    color: #2563eb;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">It's working!</div>
    <h1>Hello, world 👋</h1>
    <p>This is a simple test page, ready to publish with GitHub Pages.</p>
  </div>
</body>
</html>
